<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agomoni Sur - Durga Puja Special</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0c0703;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(10, 5, 2, 0.72), rgba(15, 6, 2, 0.85)), 
                        radial-gradient(circle at 20% 30%, rgba(255, 140, 0, 0.18) 0%, transparent 60%),
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        .bengali-text {
            font-family: 'Hind Siliguri', sans-serif;
        }

        .golden-glass {
            background: linear-gradient(135deg, rgba(60, 30, 10, 0.75) 0%, rgba(15, 8, 2, 0.9) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 170, 60, 0.28);
            border-top: 1px solid rgba(255, 210, 100, 0.55);
            border-left: 1px solid rgba(255, 190, 80, 0.45);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.75), 
                0 0 35px rgba(249, 115, 22, 0.22), 
                inset 0 1px 15px rgba(255, 180, 80, 0.18);
        }

        /* Custom Scrollbar for Playlist */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #FF8C00, #FFB75E);
            border-radius: 4px;
            width: 0%;
        }
        
        .progress-bar-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 13px;
            height: 13px;
            background: #FFE4B5;
            border-radius: 50%;
            left: 0%;
            box-shadow: 0 0 8px rgba(255, 140, 0, 0.8);
        }

        .playlist-item {
            transition: all 0.2s ease;
        }
        
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.active {
            background: linear-gradient(90deg, rgba(255, 140, 0, 0.25) 0%, transparent 100%);
            border-left: 3px solid #f97316;
        }

        .live-dot {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.35; }
            100% { opacity: 1; }
        }

        .main-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }
    </style>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <!-- Offscreen YouTube iframe container (Kept active for background playback) -->
    <div style="position: fixed; bottom: -300px; right: -300px; width: 200px; height: 200px; opacity: 0.001; pointer-events: none; z-index: -999;">
        <div id="yt-player"></div>
    </div>

    <!-- Overlay for better text readability -->
    <div class="absolute inset-0 bg-black/25 z-0 pointer-events-none"></div>

    <div class="main-content-wrapper z-10 w-full h-full p-4 md:p-6 lg:p-8 flex flex-col justify-between">
        
        <!-- Top bar with user profile/admin button -->
        <div class="w-full flex justify-end items-center z-20">
            <button id="open-passcode-modal" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-[#ffaa3c]/30 text-[#ffb866] hover:text-white flex items-center justify-center transition-all shadow-lg active:scale-95" title="Admin Access">
                <i class="fas fa-user text-base"></i>
            </button>
        </div>

        <!-- Middle Section: Playlist on the right -->
        <div class="flex-grow flex items-center justify-end w-full mt-4 lg:mt-0 relative z-20">
            
            <!-- Playlist Container -->
            <div class="golden-glass rounded-[1.5rem] w-full lg:w-[415px] flex flex-col h-[60vh] max-h-[460px] overflow-hidden mr-0 lg:mr-8 transition-all duration-300 shadow-2xl relative" id="playlist-container">
                
                <!-- Category Drawer (Slide-in Menu) -->
                <div id="playlist-category-drawer" class="absolute top-0 left-0 w-[68%] h-full bg-gradient-to-br from-[#3c1e0a]/98 to-[#1a0a00]/98 backdrop-blur-2xl border-r border-[#ffb450]/20 transform -translate-x-full transition-transform duration-300 ease-out z-30 flex flex-col shadow-[15px_0_30px_rgba(0,0,0,0.6)]">
                    <div class="px-5 py-4 flex items-center justify-between border-b border-white/10 mt-2">
                        <h4 class="font-bold text-[13px] tracking-widest text-[#ffb866]">CATEGORIES</h4>
                        <button id="close-category-drawer" class="text-gray-400 hover:text-white w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="flex-grow overflow-y-auto px-3 py-2 space-y-1">
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Mahalaya')">
                            Mahalaya <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Shasthi')">
                            Shasthi <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Saptami')">
                            Saptami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Ashtami')">
                            Ashtami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Navami')">
                            Navami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Dashami')">
                            Dashami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('All Tracks')">
                            All Tracks <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                    </div>
                </div>

                <!-- Playlist Header -->
                <div class="px-6 py-4 flex justify-between items-center bg-transparent mt-2 relative z-20">
                    <div class="flex items-center gap-2.5 cursor-pointer group hover:bg-white/5 px-3 py-1.5 -ml-3 rounded-lg transition-colors" id="open-category-drawer" title="View Categories">
                        <i class="fas fa-list-ul text-[#ff9d33]"></i>
                        <h3 class="font-bold text-[13px] tracking-[0.15em] text-[#ffb866] group-hover:text-white transition-colors" id="playlist-main-title">PLAYLIST (0)</h3>
                        <i class="fas fa-chevron-right text-[#ffb866] text-[10px] opacity-70 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <button id="toggle-playlist" class="text-[12px] font-medium text-gray-300 hover:text-white bg-white/5 hover:bg-white/10 px-3.5 py-1.5 rounded-full border border-white/10 transition-colors flex items-center gap-2">
                        <i class="fas fa-chevron-up transition-transform duration-300" id="playlist-icon"></i>
                        <span id="playlist-toggle-text">Hide List</span>
                    </button>
                </div>

                <!-- Playlist Items -->
                <div class="overflow-y-auto flex-grow px-3 pb-3 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent" id="playlist-items">
                    <!-- Dynamic Tracks injected here -->
                </div>
            </div>
        </div>

        <!-- Bottom Section: Player -->
        <div class="w-full flex justify-center z-20 mt-4 pb-4">
            
            <!-- Player Control Bar -->
            <div class="golden-glass rounded-[2rem] w-full lg:w-[1000px] p-3 pr-6 flex flex-col lg:flex-row items-center justify-between relative gap-6 lg:gap-8 mx-auto">
                
                <!-- Left: Album Art & Track Info (Including Progress) -->
                <div class="flex items-center gap-5 w-full lg:w-[60%] flex-shrink-0 min-w-0 pl-1">
                    <img 
                        src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80" 
                        alt="Album Art" 
                        id="current-album-art" 
                        class="w-[90px] h-[90px] rounded-[1rem] object-cover shadow-lg border border-white/10 shrink-0 transition-all duration-300"
                        onerror="this.src='https://placehold.co/150x150/3c1e0a/ffb450?text=Music'"
                    />
                    
                    <div class="flex flex-col justify-center w-full min-w-0 py-1">
                        <!-- LIVE Badge -->
                        <div class="flex items-center gap-2 mb-1.5 bg-[#521313] px-2.5 py-0.5 rounded-full w-fit">
                            <div class="w-1.5 h-1.5 bg-red-500 rounded-full live-dot shadow-[0_0_5px_rgba(239,68,68,0.8)]"></div>
                            <span class="text-[10px] font-bold text-white tracking-widest">LIVE</span>
                        </div>
                        
                        <!-- Track Details -->
                        <h4 class="font-semibold text-white text-[17px] tracking-wide truncate mb-0.5" id="current-track-title">গান যোগ করুন</h4>
                        <span class="text-[13px] text-gray-300 truncate mb-4" id="current-track-artist">শিল্পী নির্বাচন নেই</span>
                        
                        <!-- Progress Bar & Timestamps -->
                        <div class="w-full relative">
                            <div class="progress-bar-container h-[5px] bg-white/10 rounded-full relative cursor-pointer w-full" id="progress-container">
                                <div class="progress-bar-fill absolute top-0 left-0 h-full bg-gradient-to-r from-[#FF8C00] to-[#FFB75E] rounded-full" id="progress-fill" style="width: 0%;"></div>
                                <div class="progress-bar-thumb absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-[#FFE4B5] rounded-full shadow-[0_0_8px_rgba(255,140,0,0.6)]" id="progress-thumb" style="left: 0%;"></div>
                            </div>
                            <div class="flex justify-between items-center w-full mt-2 px-0.5">
                                <span class="text-[11px] text-gray-300 font-medium tracking-wide" id="current-time">00:00</span>
                                <span class="text-[11px] text-gray-300 font-medium tracking-wide" id="total-time">00:00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Center: Main Controls -->
                <div class="flex items-center justify-center gap-5 shrink-0">
                    <button class="w-[42px] h-[42px] rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-white transition-colors shadow-inner" id="prev-btn" title="Previous">
                        <i class="fas fa-backward-step text-sm"></i>
                    </button>
                    <button class="w-[56px] h-[56px] rounded-full bg-gradient-to-b from-[#FFA751] to-[#E65C00] hover:scale-105 active:scale-95 text-white flex items-center justify-center shadow-[0_4px_15px_rgba(230,92,0,0.3)] transition-transform" id="play-pause-btn" title="Play / Pause">
                        <i class="fas fa-play text-xl ml-0.5"></i>
                    </button>
                    <button class="w-[42px] h-[42px] rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-white transition-colors shadow-inner" id="next-btn" title="Next">
                        <i class="fas fa-forward-step text-sm"></i>
                    </button>
                </div>

                <!-- Right: Volume & Mute (Shifted 1cm left) -->
                <div class="flex items-center justify-end gap-3 shrink-0 mr-4 lg:mr-8 pr-6 w-[170px]">
                    <i class="fas fa-volume-up text-gray-300 text-sm cursor-pointer hover:text-white transition-colors" id="mute-icon" title="Mute / Unmute"></i>
                    <div class="w-[85px] h-[5px] bg-white/20 rounded-full relative cursor-pointer py-1" id="volume-container">
                        <div class="absolute top-1/2 -translate-y-1/2 left-0 h-[5px] bg-gradient-to-r from-[#FF8C00] to-[#FFB75E] rounded-full pointer-events-none" id="volume-fill" style="width: 100%;"></div>
                        <div class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-[#FFE4B5] rounded-full shadow-[0_0_6px_rgba(255,140,0,0.8)] pointer-events-none" id="volume-thumb" style="left: 100%;"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL: PASSCODE VERIFICATION (47842828) -->
    <div id="passcode-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="golden-glass w-full max-w-xs rounded-3xl p-6 border border-[#ffaa3c]/40 shadow-2xl relative text-center">
            <button id="close-passcode-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white w-7 h-7 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors">
                <i class="fas fa-times"></i>
            </button>
            <div class="w-12 h-12 mx-auto rounded-full bg-[#ff9d33]/20 border border-[#ffaa3c]/40 flex items-center justify-center text-[#ffb866] mb-3">
                <i class="fas fa-lock text-lg"></i>
            </div>
            <h3 class="text-base font-bold text-white mb-1">প্রবেশ পাসকোড দিন</h3>
            <p class="text-xs text-gray-400 mb-4">অ্যাডমিন অ্যাক্সেসের জন্য পাসকোড লিখুন</p>
            <form id="passcode-form" class="space-y-3">
                <input type="password" id="input-passcode" placeholder="পাসকোড দিন" maxlength="12" class="w-full text-center tracking-widest bg-black/50 border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors" autocomplete="off">
                <p id="passcode-error" class="text-xs text-red-400 hidden">ভুল পাসকোড! আবার চেষ্টা করুন।</p>
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-[#FF8C00] to-[#E65C00] hover:opacity-95 text-white font-bold text-xs rounded-xl shadow-lg transition-transform active:scale-[0.98]">
                    যাচাই করুন
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD SONG / PLAYLIST POPUP -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="golden-glass w-full max-w-md rounded-3xl p-6 border border-[#ffaa3c]/40 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-[#ffb866] flex items-center gap-2">
                    <i class="fas fa-layer-group"></i> গান / প্লেলিস্ট যোগ করুন
                </h3>
                <button id="close-add-modal" class="text-gray-400 hover:text-white w-7 h-7 rounded-full flex items-center justify-center hover:bg-white/10">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Tabs: Single Track vs Full YouTube Playlist -->
            <div class="flex rounded-xl bg-black/40 p-1 mb-4 border border-white/10">
                <button type="button" id="tab-single-btn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-white bg-gradient-to-r from-[#FF8C00] to-[#E65C00] shadow transition-all">
                    একক গান (Single)
                </button>
                <button type="button" id="tab-playlist-btn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all">
                    ইউটিউব প্লেলিস্ট (Full Playlist)
                </button>
            </div>

            <!-- Form 1: Single Track -->
            <form id="add-song-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">YouTube বা MP3 লিংক</label>
                    <input type="url" id="input-song-url" required placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-black/40 border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">গানের নাম (Title)</label>
                    <input type="text" id="input-song-title" required placeholder="যেমন: Chandipath বা Dugga Elo" class="w-full bg-black/40 border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">শিল্পী (Artist)</label>
                    <input type="text" id="input-song-artist" required placeholder="যেমন: Birendra Krishna Bhadra" class="w-full bg-black/40 border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">ক্যাটাগরি (Category)</label>
                    <select id="input-song-category" class="w-full bg-[#201005] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors">
                        <option value="Mahalaya">Mahalaya</option>
                        <option value="Shasthi">Shasthi</option>
                        <option value="Saptami">Saptami</option>
                        <option value="Ashtami">Ashtami</option>
                        <option value="Navami">Navami</option>
                        <option value="Dashami">Dashami</option>
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#FF8C00] to-[#E65C00] hover:opacity-95 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-[0.98]">
                        গানটি প্লেলিস্টে সেভ করুন
                    </button>
                </div>
            </form>

            <!-- Form 2: Entire YouTube Playlist Import (Multi-Tier Engine) -->
            <form id="add-playlist-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">YouTube Playlist লিংক</label>
                    <input type="url" id="input-playlist-url" required placeholder="https://www.youtube.com/playlist?list=PL..." class="w-full bg-black/40 border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors">
                    <p class="text-[11px] text-gray-400 mt-1">পাবলিক বা আনলিস্টেড যে কোনো ইউটিউব প্লেলিস্ট স্বয়ংক্রিয়ভাবে এক্সট্র্যাক্ট হবে।</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">কোন ক্যাটাগরিতে যোগ হবে?</label>
                    <select id="input-playlist-category" class="w-full bg-[#201005] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors">
                        <option value="Mahalaya">Mahalaya</option>
                        <option value="Shasthi" selected>Shasthi</option>
                        <option value="Saptami">Saptami</option>
                        <option value="Ashtami">Ashtami</option>
                        <option value="Navami">Navami</option>
                        <option value="Dashami">Dashami</option>
                    </select>
                </div>

                <div id="playlist-status-msg" class="text-xs text-center py-2.5 px-3 rounded-lg bg-black/40 border border-white/10 hidden font-medium transition-all"></div>

                <div class="pt-2">
                    <button type="submit" id="btn-fetch-playlist" class="w-full py-3 bg-gradient-to-r from-[#FF8C00] to-[#E65C00] hover:opacity-95 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-[0.98] flex items-center justify-center gap-2">
                        <i class="fas fa-cloud-arrow-down"></i> সব গান ফেচ করে যুক্ত করুন
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /* ==========================================================
           প্লেলিস্ট ডাটা এবং লোকাল স্টোরেজ সিঙ্ক
           ========================================================== */
        const playlistsData = {
            'Mahalaya': [],
            'Shasthi': [],
            'Saptami': [],
            'Ashtami': [],
            'Navami': [],
            'Dashami': [],
            'All Tracks': []
        };

        const savedTracks = localStorage.getItem('agomoni_user_tracks');
        if (savedTracks) {
            try {
                const parsed = JSON.parse(savedTracks);
                for (const cat in parsed) {
                    if (playlistsData[cat]) {
                        playlistsData[cat] = parsed[cat];
                    }
                }
            } catch(e) {
                console.error("Error loading local tracks", e);
            }
        }

        function refreshAllTracks() {
            let combined = [];
            for (const cat in playlistsData) {
                if (cat !== 'All Tracks') {
                    combined = combined.concat(playlistsData[cat]);

            }
            playlistsData['All Tracks'] = combined;
        }
        refreshAllTracks();

        const audio = new Audio();
        
        let ytPlayer;
        let ytPlayerReady = false;
        let activePlayerType = 'html5';
        let ytProgressInterval;

        let currentPlaylistName = 'All Tracks';
        let tracks = playlistsData[currentPlaylistName];
        let currentTrackId = tracks.length > 0 ? tracks[0].id : null;
        let isPlaying = false; 
        
        // UI Elements
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = playPauseBtn.querySelector('i');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressThumb = document.getElementById('progress-thumb');

        const totalTimeDisplay = document.getElementById('total-time');
        const trackTitleDisplay = document.getElementById('current-track-title');

        const currentAlbumArt = document.getElementById('current-album-art');

        // YouTube API Initialization
        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '200',
                width: '200',
                videoId: '',
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 0,
                    'playsinline': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        function onPlayerReady(event) {
            ytPlayerReady = true;
            if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
                ytPlayer.setVolume(currentVolume * 100);
            }
        }

        function onPlayerStateChange(event) {
            if (activePlayerType !== 'youtube') return;
            
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                setPlayIcon(true);
                startYTProgress();
                if (typeof ytPlayer.getDuration === 'function') {
                    totalTimeDisplay.textContent = formatTime(ytPlayer.getDuration());
                }
            } else if (event.data == YT.PlayerState.PAUSED) {
                isPlaying = false;
                setPlayIcon(false);
                stopYTProgress();
            } else if (event.data == YT.PlayerState.ENDED) {
                playNextTrack();
            }
            updateActiveTrackUI();
        }

        function extractVideoID(url) {
            if (!url) return null;
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : (url.length === 11 ? url : null);
        }

        function extractPlaylistID(url) {
            if (!url) return null;
            const regExp = /[?&]list=([a-zA-Z0-9_-]+)/;
            const match = url.match(regExp);
            return match ? match[1] : (url.startsWith('PL') ? url : null);
        }

        function startYTProgress() {
            stopYTProgress();
            ytProgressInterval = setInterval(() => {
                if (ytPlayer && activePlayerType === 'youtube' && typeof ytPlayer.getCurrentTime === 'function') {
                    const curr = ytPlayer.getCurrentTime();
                    const duration = ytPlayer.getDuration();
                    if (duration > 0) {
                        updateProgressBar((curr / duration) * 100);
                        currentTimeDisplay.textContent = formatTime(curr);
                    }
                }
            }, 400);
        }

        function stopYTProgress() {
            if (ytProgressInterval) clearInterval(ytProgressInterval);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !seconds) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function setPlayIcon(isPlay) {
            if (isPlay) {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            }
        }

        function updateProgressBar(percentage) {
            const clamped = Math.max(0, Math.min(100, percentage));
            progressFill.style.width = `${clamped}%`;
            progressThumb.style.left = `${clamped}%`;
        }

        // --- INTERACTIVE SEEK (CLICK + DRAG) ---
        let isSeeking = false;

        function handleSeek(clientX) {
            const rect = progressContainer.getBoundingClientRect();
            let pos = (clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            updateProgressBar(pos * 100);

            if (activePlayerType === 'youtube' && ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const dur = ytPlayer.getDuration();
                if (dur > 0) {
                    ytPlayer.seekTo(pos * dur, true);
                    currentTimeDisplay.textContent = formatTime(pos * dur);
                }
            } else if (activePlayerType === 'html5' && !isNaN(audio.duration) && audio.duration > 0) {
                audio.currentTime = pos * audio.duration;
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
            }
        }

        progressContainer.addEventListener('mousedown', (e) => {
            isSeeking = true;
            handleSeek(e.clientX);
        });

        progressContainer.addEventListener('touchstart', (e) => {
            isSeeking = true;
            if (e.touches[0]) handleSeek(e.touches[0].clientX);
        }, { passive: true });

        // --- INTERACTIVE VOLUME (CLICK + DRAG) ---
        let currentVolume = 1;
        let isAdjustingVolume = false;

        function setVolume(pos) {
            pos = Math.max(0, Math.min(1, pos));
            currentVolume = pos;
            audio.volume = pos;

            if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
                ytPlayer.setVolume(pos * 100);
                if (pos > 0 && typeof ytPlayer.isMuted === 'function' && ytPlayer.isMuted()) {
                    ytPlayer.unMute();
                }
            }
            updateVolumeUI(pos);
        }

        function handleVolumeMove(clientX) {
            const rect = volumeContainer.getBoundingClientRect();
            let pos = (clientX - rect.left) / rect.width;
            setVolume(pos);
        }

        volumeContainer.addEventListener('mousedown', (e) => {
            isAdjustingVolume = true;
            handleVolumeMove(e.clientX);
        });

        volumeContainer.addEventListener('touchstart', (e) => {
            isAdjustingVolume = true;
            if (e.touches[0]) handleVolumeMove(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (isSeeking) handleSeek(e.clientX);
            if (isAdjustingVolume) handleVolumeMove(e.clientX);
        });

        window.addEventListener('touchmove', (e) => {
            if (!e.touches[0]) return;
            if (isSeeking) handleSeek(e.touches[0].clientX);
            if (isAdjustingVolume) handleVolumeMove(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('mouseup', () => {
            isSeeking = false;
            isAdjustingVolume = false;
        });

        window.addEventListener('touchend', () => {
            isSeeking = false;
            isAdjustingVolume = false;
        });

        function updateVolumeUI(vol) {
            volumeFill.style.width = `${vol * 100}%`;
            volumeThumb.style.left = `${vol * 100}%`;
            if (vol === 0) {
                muteIcon.className = "fas fa-volume-mute text-gray-300 text-sm cursor-pointer hover:text-white transition-colors";
            } else if (vol < 0.5) {
                muteIcon.className = "fas fa-volume-down text-gray-300 text-sm cursor-pointer hover:text-white transition-colors";
            } else {
                muteIcon.className = "fas fa-volume-up text-gray-300 text-sm cursor-pointer hover:text-white transition-colors";
            }
        }

        muteIcon.addEventListener('click', () => {
            if (currentVolume > 0) {
                audio.muted = true;
                if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute();
                setVolume(0);
            } else {
                audio.muted = false;
                if (ytPlayer && typeof ytPlayer.unMute === 'function') ytPlayer.unMute();
                setVolume(0.8);
            }
        });

        audio.addEventListener('play', () => {
            if(activePlayerType !== 'html5') return;

        });

        audio.addEventListener('pause', () => {
            if(activePlayerType !== 'html5') return;
            isPlaying = false;
            setPlayIcon(false);
            updateActiveTrackUI();
        });

        audio.addEventListener('timeupdate', () => {
            if (activePlayerType !== 'html5') return;
            if (!isNaN(audio.duration)) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                updateProgressBar(percentage);
                currentTimeDisplay.textContent = formatTime(audio.currentTime);

        function playNextTrack() {
            if (tracks.length === 0) return;
            const currentIndex = tracks.findIndex(t => t.id === currentTrackId);

            } else {

            }
        }

        function playPrevTrack() {
            if (tracks.length === 0) return;
            const currentIndex = tracks.findIndex(t => t.id === currentTrackId);
            if (currentIndex > 0) {

        window.playTrack = function(id) {
            let track = tracks.find(t => t.id === id);
            if (!track) {
                for (const listName in playlistsData) {
                    const found = playlistsData[listName].find(t => t.id === id);
                    if(found) { track = found; break; }
                }
            }

            if (track) {
                currentTrackId = track.id;
                
                updateProgressBar(0);
                currentTimeDisplay.textContent = "00:00";
                totalTimeDisplay.textContent = track.duration || "00:00";
                trackTitleDisplay.textContent = track.title;
                trackArtistDisplay.textContent = track.artist;
                currentAlbumArt.src = track.image || 'https://placehold.co/150x150/3c1e0a/ffb450?text=Music';
                
                if (track.isYoutube && track.ytUrl) {
                    activePlayerType = 'youtube';
                    audio.pause();
                    audio.currentTime = 0;
                    
                    const videoId = extractVideoID(track.ytUrl);
                    if (videoId) {
                        const startPlay = () => {
                            if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                                ytPlayer.loadVideoById(videoId);
                                ytPlayer.playVideo();
                            }
                        };
                        
                        if (ytPlayerReady) {
                            startPlay();
                        } else {
                            const timer = setInterval(() => {
                                if (ytPlayerReady) {
                                    clearInterval(timer);
                                    startPlay();
                                }
                            }, 200);
                        }
                    }
                } else {
                    activePlayerType = 'html5';
                    if (ytPlayerReady && typeof ytPlayer.pauseVideo === 'function') {
                        ytPlayer.pauseVideo();
                    }
                    stopYTProgress();
                    
                    audio.src = track.url;
                    audio.play().catch(e => console.log("Autoplay blocked."));
                }
                
                renderPlaylist();
            }
        };

        // Helper: Video ID থেকে টাইটেল ও আর্টিস্ট ফেচ করা (CORS-friendly NoEmbed API)
        async function fetchVideoMetadata(videoId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`, { signal: AbortSignal.timeout(3000) });
                if (res.ok) {
                    const data = await res.json();
                    return {
                        title: data.title || "YouTube Track",
                        artist: data.author_name || "YouTube Music"
                    };
                }
            } catch(e) {}
            return {
                title: "YouTube Track (" + videoId + ")",
                artist: "YouTube Music"
            };
        }

        // Tier 1: YouTube Scraper via High-Speed CORS Proxies
        async function fetchPlaylistViaCORSProxy(playlistId) {
            const targetUrl = `https://www.youtube.com/playlist?list=${playlistId}`;
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (const proxy of proxies) {
                try {
                    const res = await fetch(proxy, { signal: AbortSignal.timeout(6000) });
                    if (!res.ok) continue;

                    let html = '';
                    if (proxy.includes('allorigins')) {
                        const json = await res.json();
                        html = json.contents || '';
                    } else {
                        html = await res.text();
                    }

                    if (!html || !html.includes('ytInitialData')) continue;

                    // Extract ytInitialData
                    const match = html.match(/ytInitialData\s*=\s*({.+?});<\/script>/s) || html.match(/ytInitialData\s*=\s*({.+?});/);
                    if (match && match[1]) {
                        const data = JSON.parse(match[1]);
                        const videos = [];
                        
                        // Recursive traverse to find playlistVideoRenderer items
                        const findVideos = (obj) => {
                            if (!obj || typeof obj !== 'object') return;
                            if (obj.playlistVideoRenderer) {
                                const v = obj.playlistVideoRenderer;
                                if (v.videoId) {
                                    videos.push({
                                        videoId: v.videoId,
                                        title: v.title?.runs?.[0]?.text || "YouTube Track",
                                        artist: v.shortBylineText?.runs?.[0]?.text || "YouTube Music",
                                        duration: v.lengthText?.simpleText || "03:30"
                                    });
                                }
                            }
                            for (const k in obj) {
                                findVideos(obj[k]);
                            }
                        };
                        findVideos(data);

                        if (videos.length > 0) return videos;
                    }
                } catch(e) {
                    console.warn("Proxy attempt failed:", proxy, e);
                }
            }
            return null;
        }

        // Tier 2: YouTube Iframe API Native Playlist Cue Fallback
        function fetchPlaylistViaIFrame(playlistId) {
            return new Promise((resolve) => {
                if (!ytPlayer || typeof ytPlayer.cuePlaylist !== 'function') {
                    return resolve(null);
                }

                let attempts = 0;
                ytPlayer.cuePlaylist({
                    listType: 'playlist',
                    list: playlistId
                });

                const checkInterval = setInterval(() => {
                    attempts++;
                    try {
                        const list = ytPlayer.getPlaylist();
                        if (Array.isArray(list) && list.length > 0) {
                            clearInterval(checkInterval);
                            resolve(list);
                            return;
                        }
                    } catch(e) {}

                    if (attempts > 12) { // 3.6 seconds max wait
                        clearInterval(checkInterval);
                        resolve(null);
                    }
                }, 300);
            });
        }

        // Handle Entire YouTube Playlist Submit
        addPlaylistForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const playlistUrl = document.getElementById('input-playlist-url').value.trim();
            const category = document.getElementById('input-playlist-category').value;
            const playlistId = extractPlaylistID(playlistUrl);

            if (!playlistId) {
                alert('সঠিক YouTube Playlist লিংক দিন (লিংকে list=... থাকতে হবে)');
                return;
            }

            playlistStatusMsg.classList.remove('hidden', 'text-red-400', 'text-green-400');
            playlistStatusMsg.classList.add('text-orange-300');
            playlistStatusMsg.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> ইউটিউব থেকে প্লেলিস্ট তথ্য আনা হচ্ছে...';
            btnFetchPlaylist.disabled = true;
            btnFetchPlaylist.classList.add('opacity-50');

            let parsedVideos = [];

            // 1. Try Tier 1 (CORS Scraper)
            try {
                parsedVideos = await fetchPlaylistViaCORSProxy(playlistId);
            } catch(err) {
                console.warn("Tier 1 failed", err);
            }

            // 2. If Tier 1 didn't find, Try Tier 2 (YouTube IFrame Native API)
            if (!parsedVideos || parsedVideos.length === 0) {
                playlistStatusMsg.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> ব্রাউজার এপিআই দিয়ে গানগুলো লোড করা হচ্ছে...';
                const videoIdList = await fetchPlaylistViaIFrame(playlistId);
                
                if (videoIdList && videoIdList.length > 0) {
                    playlistStatusMsg.innerHTML = `<i class="fas fa-spinner fa-spin mr-1.5"></i> ${videoIdList.length}টি গান পাওয়া গেছে, শিরোনাম আনা হচ্ছে...`;
                    
                    parsedVideos = [];
                    for (let i = 0; i < videoIdList.length; i++) {
                        const vid = videoIdList[i];
                        const meta = await fetchVideoMetadata(vid);
                        parsedVideos.push({
                            videoId: vid,
                            title: meta.title,
                            artist: meta.artist,
                            duration: "Live"
                        });
                    }
                }
            }

            btnFetchPlaylist.disabled = false;
            btnFetchPlaylist.classList.remove('opacity-50');

            if (parsedVideos && parsedVideos.length > 0) {
                playlistStatusMsg.classList.remove('text-orange-300');
                playlistStatusMsg.classList.add('text-green-400');
                playlistStatusMsg.innerHTML = `✓ সফলভাবে ${parsedVideos.length}টি গান পাওয়া গেছে! লিস্টে যোগ হচ্ছে...`;

                const formattedTracks = parsedVideos.map((v, idx) => ({
                    id: 'yt_pl_' + v.videoId + '_' + Date.now() + '_' + idx,
                    title: v.title,
                    artist: v.artist,
                    duration: v.duration || "03:45",
                    isYoutube: true,
                    ytUrl: `https://www.youtube.com/watch?v=${v.videoId}`,
                    image: `https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg`
                }));

                // Append all playlist tracks
                if (!playlistsData[category]) playlistsData[category] = [];
                playlistsData[category].push(...formattedTracks);

                refreshAllTracks();
                localStorage.setItem('agomoni_user_tracks', JSON.stringify(playlistsData));

                setTimeout(() => {
                    selectCategory(category);
                    if (formattedTracks.length > 0) {
                        playTrack(formattedTracks[0].id);
                    }
                    addPlaylistForm.reset();
                    playlistStatusMsg.classList.add('hidden');
                    addModal.classList.add('hidden');
                }, 800);

            } else {
                playlistStatusMsg.classList.remove('text-orange-300');
                playlistStatusMsg.classList.add('text-red-400');
                playlistStatusMsg.innerHTML = '❌ প্লেলিস্টটি লোড করা সম্ভব হয়নি। লিংকটি আবার চেক করুন।';
            }
        });

        // Initial Setup
        if (tracks.length > 0) {
            const initialTrack = tracks[0];
            trackTitleDisplay.textContent = initialTrack.title;
            trackArtistDisplay.textContent = initialTrack.artist;
            if (!initialTrack.isYoutube) {
                audio.src = initialTrack.url;
            }
            if (initialTrack.image) {
                currentAlbumArt.src = initialTrack.image;
            }
        }
        audio.volume = 1; 
        renderPlaylist();
    </script>
</body>
</html>
