    <script>
        const BACKEND_URL = 'https://backendtest-4hjb.onrender.com';

        // 100% Ad-Free Open API Instances (Fast & Active Global Cluster)
        const PIPED_INSTANCES = [
            "https://pipedapi.tokhmi.xyz",
            "https://api.piped.privacydev.net",
            "https://piped-api.lunar.icu",
            "https://pipedapi.leptons.xyz",
            "https://api.piped.yt"
        ];

        const INVIDIOUS_INSTANCES = [
            "https://inv.nadeko.net",
            "https://invidious.jing.rocks",
            "https://invidious.drgns.space",
            "https://invidious.private.coffee",
            "https://yt.artemislena.eu"
        ];

        // Cache resolved audio streams in memory
        const audioStreamCache = new Map();

        // Safe timeout signal helper (2.5s timeout per instance for speed)
        function getTimeoutSignal(ms) {
            if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
                return AbortSignal.timeout(ms);
            }
            const controller = new AbortController();
            setTimeout(() => controller.abort(), ms);
            return controller.signal;
        }

        // Fast Ad-Free Stream Resolver
        async function fetchAdFreeStreamUrl(ytVideoId) {
            if (audioStreamCache.has(ytVideoId)) {
                return audioStreamCache.get(ytVideoId);
            }

            // 1. Try Piped API Instances
            for (const instance of PIPED_INSTANCES) {
                try {
                    const res = await fetch(`${instance}/streams/${ytVideoId}`, {
                        signal: getTimeoutSignal(2500)
                    });
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (data && data.audioStreams && data.audioStreams.length > 0) {
                        const bestAudio = data.audioStreams.find(s => s.format === 'M4A' || s.mimeType?.includes('audio/mp4')) 
                                       || data.audioStreams[0];
                        if (bestAudio && bestAudio.url) {
                            audioStreamCache.set(ytVideoId, bestAudio.url);
                            return bestAudio.url;
                        }
                    }
                } catch(e) {}
            }

            // 2. Try Invidious API Instances
            for (const instance of INVIDIOUS_INSTANCES) {
                try {
                    const res = await fetch(`${instance}/api/v1/videos/${ytVideoId}`, {
                        signal: getTimeoutSignal(2500)
                    });
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (data && data.adaptiveFormats && data.adaptiveFormats.length > 0) {
                        const audioOnly = data.adaptiveFormats.find(f => f.type && f.type.startsWith('audio/mp4')) 
                                       || data.adaptiveFormats.find(f => f.type && f.type.startsWith('audio/'));
                        if (audioOnly && audioOnly.url) {
                            audioStreamCache.set(ytVideoId, audioOnly.url);
                            return audioOnly.url;
                        }
                    }
                } catch(e) {}
            }

            return null;
        }

        // YouTube IFrame Fail-Safe Engine Setup
        let ytPlayer = null;
        let isYtReady = false;
        let activePlaybackMode = 'native'; // 'native' or 'youtube'
        let ytProgressInterval = null;

        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-iframe-player', {
                height: '85',
                width: '100%',
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    rel: 0,
                    playsinline: 1
                },
                events: {
                    onReady: () => { isYtReady = true; },
                    onStateChange: onYtStateChange,
                    onError: () => { playNextTrack(); }
                }
            });
        };

        function onYtStateChange(event) {
            if (activePlaybackMode !== 'youtube') return;
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                setPlayIcon(true);
                artLoader.classList.add('hidden');
                streamModeBadge.textContent = "YOUTUBE ENGINE";
                statusBadgeText.textContent = "ইউটিউব স্ট্রিমে বাজছে";
                streamStatusDot.className = "w-1.5 h-1.5 bg-emerald-400 rounded-full live-dot";
                startYtProgressLoop();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                setPlayIcon(false);
                stopYtProgressLoop();
            } else if (event.data === YT.PlayerState.ENDED) {
                stopYtProgressLoop();
                playNextTrack();
            }
        }

        function startYtProgressLoop() {
            stopYtProgressLoop();
            ytProgressInterval = setInterval(() => {
                if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
                    const curr = ytPlayer.getCurrentTime();
                    const dur = ytPlayer.getDuration();
                    if (dur > 0) {
                        updateProgressBar((curr / dur) * 100);
                        currentTimeDisplay.textContent = formatTime(curr);
                        totalTimeDisplay.textContent = formatTime(dur);
                    }
                }
            }, 500);
        }

        function stopYtProgressLoop() {
            if (ytProgressInterval) {
                clearInterval(ytProgressInterval);
                ytProgressInterval = null;
            }
        }

        // Toggle YouTube mini player visibility
        const ytWrapper = document.getElementById('yt-player-wrapper');
        document.getElementById('toggle-yt-vis').addEventListener('click', () => {
            ytWrapper.classList.toggle('hidden');
        });

        // Master Track Player (Zero-Hang Guaranteed Audio Flow)
        window.playTrack = async function(id) {
            let track = tracks.find(t => t.id === id);
            if (!track) {
                for (const cat in playlistsData) {
                    const found = playlistsData[cat].find(t => t.id === id);
                    if (found) { track = found; break; }
                }
            }
            if (!track) return;

            currentTrackId = track.id;
            updateProgressBar(0);
            currentTimeDisplay.textContent = "00:00";
            totalTimeDisplay.textContent = track.duration || "--:--";
            trackTitleDisplay.textContent = track.title;
            trackArtistDisplay.textContent = track.artist;
            if (track.image) currentAlbumArt.src = track.image;

            artLoader.classList.remove('hidden');
            statusBadgeText.textContent = "অ্যাড-ফ্রি অডিও স্ট্রিম প্রস্তুত হচ্ছে...";
            streamModeBadge.textContent = "CONNECTING...";
            streamStatusDot.className = "w-1.5 h-1.5 bg-yellow-400 rounded-full live-dot";

            // Stop any ongoing native or YT playback
            audio.pause();
            audio.removeAttribute('src');
            stopYtProgressLoop();
            if (ytPlayer && ytPlayer.stopVideo) {
                try { ytPlayer.stopVideo(); } catch(e) {}
            }

            const ytId = track.ytId || extractYouTubeId(track.ytUrl || track.url);

            if (track.isYoutube || ytId) {
                // Step 1: Try Ad-Free open API stream
                const streamUrl = await fetchAdFreeStreamUrl(ytId);

                if (streamUrl) {
                    activePlaybackMode = 'native';
                    ytWrapper.classList.add('hidden');
                    audio.src = streamUrl;
                    audio.load();
                    audio.play().then(() => {
                        isPlaying = true;
                        setPlayIcon(true);
                        artLoader.classList.add('hidden');
                        statusBadgeText.textContent = "১০০% বিজ্ঞাপনহীন অডিও বাজছে";
                        streamModeBadge.textContent = "100% AD-FREE NATIVE";
                        streamStatusDot.className = "w-1.5 h-1.5 bg-emerald-400 rounded-full live-dot";
                    }).catch(err => {
                        console.warn("Native audio play failed, falling back to YouTube:", err);
                        fallbackToYouTube(ytId);
                    });
                } else {
                    // Step 2: Instant Fail-Safe to YouTube Engine (Never Stalls!)
                    fallbackToYouTube(ytId);
                }
            } else {
                // Direct MP3 URL
                activePlaybackMode = 'native';
                ytWrapper.classList.add('hidden');
                audio.src = track.url;
                audio.load();
                audio.play().then(() => {
                    isPlaying = true;
                    setPlayIcon(true);
                    artLoader.classList.add('hidden');
                    statusBadgeText.textContent = "সরাসরি অডিও বাজছে";
                    streamModeBadge.textContent = "DIRECT MP3";
                    streamStatusDot.className = "w-1.5 h-1.5 bg-emerald-400 rounded-full live-dot";
                }).catch(err => {
                    artLoader.classList.add('hidden');
                    console.warn("MP3 play error:", err);
                });
            }

            renderPlaylist();
        };

        // Fail-safe execution helper
        function fallbackToYouTube(ytId) {
            activePlaybackMode = 'youtube';
            statusBadgeText.textContent = "ইউটিউব ইঞ্জিনে সরাসরি চালু হচ্ছে...";
            streamModeBadge.textContent = "YOUTUBE FAIL-SAFE";
            streamStatusDot.className = "w-1.5 h-1.5 bg-orange-400 rounded-full live-dot";

            ytWrapper.classList.remove('hidden');

            const startYt = () => {
                if (ytPlayer && ytPlayer.loadVideoById) {
                    ytPlayer.loadVideoById(ytId);
                    ytPlayer.unMute();
                    ytPlayer.setVolume(currentVolume * 100);
                    ytPlayer.playVideo();
                } else {
                    setTimeout(startYt, 500);
                }
            };

            startYt();
        }

        // Native Audio Events
        audio.addEventListener('timeupdate', () => {
            if (activePlaybackMode === 'native' && !isNaN(audio.duration) && audio.duration > 0) {
                updateProgressBar((audio.currentTime / audio.duration) * 100);
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
                totalTimeDisplay.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            if (activePlaybackMode === 'native') playNextTrack();
        });

        audio.addEventListener('waiting', () => {
            if (activePlaybackMode === 'native') artLoader.classList.remove('hidden');
        });

        audio.addEventListener('canplay', () => {
            artLoader.classList.add('hidden');
        });

        audio.addEventListener('error', (e) => {
            artLoader.classList.add('hidden');
            if (activePlaybackMode === 'native') {
                const track = tracks.find(t => t.id === currentTrackId);
                const ytId = track?.ytId || extractYouTubeId(track?.ytUrl || track?.url);
                if (ytId) fallbackToYouTube(ytId);
            }
        });

        // Controls
        playPauseBtn.addEventListener('click', () => {
            if (activePlaybackMode === 'youtube') {
                if (ytPlayer && ytPlayer.getPlayerState) {
                    const state = ytPlayer.getPlayerState();
                    if (state === YT.PlayerState.PLAYING) {
                        ytPlayer.pauseVideo();
                    } else {
                        ytPlayer.playVideo();
                    }
                }
                return;
            }

            if (!audio.src) {
                if (tracks.length > 0) playTrack(tracks[0].id);
                return;
            }

            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    setPlayIcon(true);
                }).catch(console.warn);
            } else {
                audio.pause();
                isPlaying = false;
                setPlayIcon(false);
            }
            renderPlaylist();
        });

        // Progress Seeking
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

            if (activePlaybackMode === 'youtube') {
                if (ytPlayer && ytPlayer.getDuration) {
                    const dur = ytPlayer.getDuration();
                    if (dur > 0) ytPlayer.seekTo(pos * dur, true);
                }
            } else {
                if (!isNaN(audio.duration) && audio.duration > 0) {
                    audio.currentTime = pos * audio.duration;
                }
            }
        });

        // Volume Bar
        function setVolume(val) {
            const clamped = Math.max(0, Math.min(1, val));
            currentVolume = clamped;
            audio.volume = clamped;
            audio.muted = (clamped === 0);

            if (ytPlayer && ytPlayer.setVolume) {
                ytPlayer.setVolume(clamped * 100);
                if (clamped === 0) ytPlayer.mute(); else ytPlayer.unMute();
            }

            volumeFill.style.width = `${clamped * 100}%`;
            volumeThumb.style.left = `${clamped * 100}%`;
            muteIcon.className = clamped === 0 
                ? "fas fa-volume-mute text-gray-300 text-sm cursor-pointer" 
                : "fas fa-volume-up text-gray-300 text-sm cursor-pointer";
        }
