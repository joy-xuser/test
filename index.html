<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agomoni Sur - Durga Puja Special</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0c0703;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(10, 5, 2, 0.72), rgba(15, 6, 2, 0.85)), 
                        radial-gradient(circle at 20% 30%, rgba(255, 140, 0, 0.18) 0%, transparent 60%),
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        .golden-glass {
            background: linear-gradient(135deg, rgba(60, 30, 10, 0.75) 0%, rgba(15, 8, 2, 0.9) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 170, 60, 0.28);
            border-top: 1px solid rgba(255, 210, 100, 0.55);
            border-left: 1px solid rgba(255, 190, 80, 0.45);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.75), 
                0 0 35px rgba(249, 115, 22, 0.22), 
                inset 0 1px 15px rgba(255, 180, 80, 0.18);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
        }

        .playlist-item { transition: all 0.2s ease; }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.1); }
        .playlist-item.active {
            background: linear-gradient(90deg, rgba(255, 140, 0, 0.25) 0%, transparent 100%);
            border-left: 3px solid #f97316;
        }

        .live-dot { animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
</head>
<body>

    <!-- Native HTML5 Audio Element (100% Ad-Free, Direct Audio Stream) -->
    <audio id="native-audio" preload="auto"></audio>

    <div class="absolute inset-0 bg-black/25 z-0 pointer-events-none"></div>

    <div class="z-10 w-full h-full p-4 md:p-6 lg:p-8 flex flex-col justify-between">
        
        <!-- Top bar with admin button and Backend Status -->
        <div class="w-full flex justify-between items-center z-20">
            <div id="backend-status-badge" class="px-3 py-1.5 rounded-full text-[11px] font-medium bg-black/50 border border-white/10 text-gray-300 flex items-center gap-2 shadow-lg backdrop-blur-md">
                <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse" id="status-dot"></span>
                <span id="status-text">সার্ভার স্ট্যাটাস চেক হচ্ছে...</span>
            </div>

            <button id="open-passcode-modal" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 border border-[#ffaa3c]/30 text-[#ffb866] hover:text-white flex items-center justify-center transition-all shadow-lg active:scale-95" title="Admin Access">
                <i class="fas fa-user text-base"></i>
            </button>
        </div>

        <!-- Middle Section: Playlist on the right -->
        <div class="flex-grow flex items-center justify-end w-full mt-4 lg:mt-0 relative z-20">
            
            <div class="golden-glass rounded-[1.5rem] w-full lg:w-[415px] flex flex-col h-[60vh] max-h-[460px] overflow-hidden mr-0 lg:mr-8 transition-all duration-300 shadow-2xl relative" id="playlist-container">
                
                <!-- Category Drawer -->
                <div id="playlist-category-drawer" class="absolute top-0 left-0 w-[68%] h-full bg-gradient-to-br from-[#3c1e0a]/98 to-[#1a0a00]/98 backdrop-blur-2xl border-r border-[#ffb450]/20 transform -translate-x-full transition-transform duration-300 ease-out z-30 flex flex-col shadow-[15px_0_30px_rgba(0,0,0,0.6)]">
                    <div class="px-5 py-4 flex items-center justify-between border-b border-white/10 mt-2">
                        <h4 class="font-bold text-[13px] tracking-widest text-[#ffb866]">CATEGORIES</h4>
                        <button id="close-category-drawer" class="text-gray-400 hover:text-white w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="flex-grow overflow-y-auto px-3 py-2 space-y-1">
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Mahalaya')">
                            Mahalaya <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Shasthi')">
                            Shasthi <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Saptami')">
                            Saptami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Ashtami')">
                            Ashtami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Navami')">
                            Navami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('Dashami')">
                            Dashami <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                        <button class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-gray-200 hover:text-[#ff9d33] transition-colors font-medium flex justify-between items-center group" onclick="selectCategory('All Tracks')">
                            All Tracks <i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </button>
                    </div>
                </div>

                <!-- Playlist Header -->
                <div class="px-6 py-4 flex justify-between items-center bg-transparent mt-2 relative z-20">
                    <div class="flex items-center gap-2.5 cursor-pointer group hover:bg-white/5 px-3 py-1.5 -ml-3 rounded-lg transition-colors" id="open-category-drawer" title="View Categories">
                        <i class="fas fa-list-ul text-[#ff9d33]"></i>
                        <h3 class="font-bold text-[13px] tracking-[0.15em] text-[#ffb866] group-hover:text-white transition-colors" id="playlist-main-title">PLAYLIST (0)</h3>
                        <i class="fas fa-chevron-right text-[#ffb866] text-[10px] opacity-70 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <button id="toggle-playlist" class="text-[12px] font-medium text-gray-300 hover:text-white bg-white/5 hover:bg-white/10 px-3.5 py-1.5 rounded-full border border-white/10 transition-colors flex items-center gap-2">
                        <i class="fas fa-chevron-up transition-transform duration-300" id="playlist-icon"></i>
                        <span id="playlist-toggle-text">Hide List</span>
                    </button>
                </div>

                <!-- Playlist Items -->
                <div class="overflow-y-auto flex-grow px-3 pb-3 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent" id="playlist-items">
                    <!-- Dynamic Tracks injected here -->
                </div>
            </div>
        </div>

        <!-- Bottom Section: Player Control Bar -->
        <div class="w-full flex justify-center z-20 mt-4 pb-4">
            <div class="golden-glass rounded-[2rem] w-full lg:w-[1000px] p-3 pr-6 flex flex-col lg:flex-row items-center justify-between relative gap-6 lg:gap-8 mx-auto">
                
                <!-- Left: Album Art & Track Info -->
                <div class="flex items-center gap-5 w-full lg:w-[60%] flex-shrink-0 min-w-0 pl-1">
                    <div class="relative shrink-0">
                        <img 
                            src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80" 
                            alt="Album Art" 
                            id="current-album-art" 
                            class="w-[90px] h-[90px] rounded-[1rem] object-cover shadow-lg border border-white/10 shrink-0 transition-all duration-300"
                        />
                        <div id="art-loader" class="absolute inset-0 bg-black/60 backdrop-blur-[2px] rounded-[1rem] flex items-center justify-center hidden">
                            <i class="fas fa-circle-notch fa-spin text-[#ffaa3c] text-xl"></i>
                        </div>
                    </div>
                    
                    <div class="flex flex-col justify-center w-full min-w-0 py-1">
                        <div class="flex items-center gap-2 mb-1.5 bg-[#521313] px-2.5 py-0.5 rounded-full w-fit">
                            <div class="w-1.5 h-1.5 bg-red-500 rounded-full live-dot shadow-[0_0_5px_rgba(239,68,68,0.8)]"></div>
                            <span class="text-[10px] font-bold text-white tracking-widest">AD-FREE STREAM</span>
                        </div>
                        
                        <h4 class="font-semibold text-white text-[17px] tracking-wide truncate mb-0.5" id="current-track-title">গান নির্বাচন করুন</h4>
                        <span class="text-[13px] text-gray-300 truncate mb-4" id="current-track-artist">শিল্পীর নাম</span>
                        
                        <!-- Progress Bar & Timestamps -->
                        <div class="w-full relative">
                            <div class="progress-bar-container h-[5px] bg-white/10 rounded-full relative cursor-pointer w-full" id="progress-container">
                                <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-[#FF8C00] to-[#FFB75E] rounded-full" id="progress-fill" style="width: 0%;"></div>
                                <div class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-[#FFE4B5] rounded-full shadow-[0_0_8px_rgba(255,140,0,0.6)]" id="progress-thumb" style="left: 0%;"></div>
                            </div>
                            <div class="flex justify-between items-center w-full mt-2 px-0.5">
                                <span class="text-[11px] text-gray-300 font-medium tracking-wide" id="current-time">00:00</span>
                                <span class="text-[11px] text-gray-300 font-medium tracking-wide" id="total-time">00:00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Center: Controls -->
                <div class="flex items-center justify-center gap-3 md:gap-4 shrink-0">
                    <button class="w-[36px] h-[36px] rounded-full text-gray-400 hover:text-white transition-colors flex items-center justify-center" id="shuffle-btn" title="Shuffle: বন্ধ">
                        <i class="fas fa-shuffle text-xs"></i>
                    </button>
                    <button class="w-[42px] h-[42px] rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-white transition-colors shadow-inner active:scale-95" id="prev-btn">
                        <i class="fas fa-backward-step text-sm"></i>
                    </button>
                    <button class="w-[56px] h-[56px] rounded-full bg-gradient-to-b from-[#FFA751] to-[#E65C00] hover:scale-105 active:scale-95 text-white flex items-center justify-center shadow-[0_4px_15px_rgba(230,92,0,0.3)] transition-transform" id="play-pause-btn">
                        <i class="fas fa-play text-xl ml-0.5"></i>
                    </button>
                    <button class="w-[42px] h-[42px] rounded-full bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-white transition-colors shadow-inner active:scale-95" id="next-btn">
                        <i class="fas fa-forward-step text-sm"></i>
                    </button>
                    <button class="w-[36px] h-[36px] rounded-full text-[#ffb866] hover:text-white transition-colors flex items-center justify-center relative" id="repeat-btn" title="Repeat: সব গান">
                        <i class="fas fa-repeat text-xs" id="repeat-icon"></i>
                    </button>
                </div>

                <!-- Right: Volume (1cm left-aligned) -->
                <div class="flex items-center justify-end gap-3 shrink-0 mr-4 lg:mr-8 pr-6 w-[170px]">
                    <i class="fas fa-volume-up text-gray-300 text-sm cursor-pointer hover:text-white transition-colors" id="mute-icon"></i>
                    <div class="w-[85px] h-[5px] bg-white/20 rounded-full relative cursor-pointer py-1" id="volume-container">
                        <div class="absolute top-1/2 -translate-y-1/2 left-0 h-[5px] bg-gradient-to-r from-[#FF8C00] to-[#FFB75E] rounded-full pointer-events-none" id="volume-fill" style="width: 100%;"></div>
                        <div class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-[#FFE4B5] rounded-full shadow-[0_0_6px_rgba(255,140,0,0.8)] pointer-events-none" id="volume-thumb" style="left: 100%;"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL: PASSCODE VERIFICATION (47842828) -->
    <div id="passcode-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="golden-glass w-full max-w-xs rounded-3xl p-6 border border-[#ffaa3c]/40 shadow-2xl relative text-center">
            <button id="close-passcode-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white w-7 h-7 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors">
                <i class="fas fa-times"></i>
            </button>
            <div class="w-12 h-12 mx-auto rounded-full bg-[#ff9d33]/20 border border-[#ffaa3c]/40 flex items-center justify-center text-[#ffb866] mb-3">
                <i class="fas fa-lock text-lg"></i>
            </div>
            <h3 class="text-base font-bold text-white mb-1">প্রবেশ পাসকোড দিন</h3>
            <p class="text-xs text-gray-400 mb-4">অ্যাডমিন অ্যাক্সেসের জন্য পাসকোড লিখুন</p>
            <form id="passcode-form" class="space-y-3">
                <input type="password" id="input-passcode" placeholder="পাসকোড দিন" maxlength="12" class="w-full text-center tracking-widest bg-black/50 border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33] transition-colors" autocomplete="off">
                <p id="passcode-error" class="text-xs text-red-400 hidden">ভুল পাসকোড! আবার চেষ্টা করুন।</p>
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-[#FF8C00] to-[#E65C00] hover:opacity-95 text-white font-bold text-xs rounded-xl shadow-lg transition-transform active:scale-[0.98]">
                    যাচাই করুন
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD SONG / PLAYLIST POPUP -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="golden-glass w-full max-w-md rounded-3xl p-6 border border-[#ffaa3c]/40 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-[#ffb866] flex items-center gap-2">
                    <i class="fas fa-layer-group"></i> গান / প্লেলিস্ট যোগ করুন
                </h3>
                <button id="close-add-modal" class="text-gray-400 hover:text-white w-7 h-7 rounded-full flex items-center justify-center hover:bg-white/10">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Tab Switcher: Single vs Full Playlist -->
            <div class="flex bg-black/50 p-1 rounded-xl mb-4 border border-white/10">
                <button type="button" id="tab-single" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-[#FF8C00] text-white transition-all">একক গান (Single)</button>
                <button type="button" id="tab-playlist" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all">ইউটিউব প্লেলিস্ট (Full Playlist)</button>
            </div>

            <form id="add-song-form" class="space-y-4">
                <div>
                    <label id="url-label" class="block text-xs font-semibold text-gray-300 uppercase mb-1">YouTube বা MP3 লিংক</label>
                    <input type="url" id="input-song-url" required placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-black/40 border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33]">
                    <p id="url-hint" class="text-[10px] text-gray-400 mt-1">একক গানের লিংক দিন</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">ক্যাটাগরি (Category)</label>
                    <select id="input-song-category" class="w-full bg-[#201005] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff9d33]">
                        <option value="Mahalaya">Mahalaya</option>
                        <option value="Shasthi" selected>Shasthi</option>
                        <option value="Saptami">Saptami</option>
                        <option value="Ashtami">Ashtami</option>
                        <option value="Navami">Navami</option>
                        <option value="Dashami">Dashami</option>
                    </select>
                </div>

                <div id="fetch-loader" class="text-xs text-center py-2 text-orange-400 hidden">
                    <i class="fas fa-spinner fa-spin mr-1"></i> <span id="loader-msg">ব্যাকএন্ড থেকে তথ্য আনা হচ্ছে...</span>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-save-song" class="w-full py-3 bg-gradient-to-r from-[#FF8C00] to-[#E65C00] hover:opacity-95 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-[0.98]">
                        বিজ্ঞাপন ছাড়া সেভ ও প্লে করুন
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /* ==========================================================
           রেন্ডার ব্যাকএন্ড কনফিগারেশন
           ========================================================== */
        let BACKEND_URL = 'https://backendtest-4hjb.onrender.com';

        // সার্ভার হেলথ চেক
        async function checkBackendStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse";
            text.textContent = "সার্ভার চেক হচ্ছে...";

            try {
                const res = await fetch(`${BACKEND_URL}/ping`, { signal: AbortSignal.timeout(8000) });
                if (res.ok) {
                    dot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]";
                    text.textContent = "সার্ভার অনলাইন (Ad-Free Active)";
                } else {
                    throw new Error();
                }
            } catch(e) {
                dot.className = "w-2 h-2 rounded-full bg-orange-400 animate-pulse";
                text.textContent = "সার্ভার স্লিপে আছে (প্রথম ক্লিকে ২০-৩০ সেকেন্ড লাগতে পারে)";
            }
        }
        checkBackendStatus();

        /* ==========================================================
           প্লেলিস্ট ডাটা
           ========================================================== */
        const defaultTracks = {
            'Mahalaya': [
                {
                    id: 'default_m1',
                    title: "মহিষাসুরমর্দিনী (Mahisasuramardini)",
                    artist: "বীরেন্দ্রকৃষ্ণ ভদ্র (Birendra Krishna Bhadra)",
                    duration: "Live",
                    isYoutube: true,
                    ytUrl: "https://www.youtube.com/watch?v=0k5X2B10U60",
                    image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=300&auto=format&fit=crop"
                }
            ],
            'Shasthi': [
                {
                    id: 'default_s1',
                    title: "Dhak Solo & Agomoni Dhun",
                    artist: "Traditional Dhak Beats",
                    duration: "Live",
                    isYoutube: false,
                    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80"
                }
            ],
            'Saptami': [],
            'Ashtami': [],
            'Navami': [],
            'Dashami': [],
            'All Tracks': []
        };

        const playlistsData = {
            'Mahalaya': [...defaultTracks['Mahalaya']],
            'Shasthi': [...defaultTracks['Shasthi']],
            'Saptami': [],
            'Ashtami': [],
            'Navami': [],
            'Dashami': [],
            'All Tracks': []
        };

        const savedTracks = localStorage.getItem('agomoni_user_tracks');
        if (savedTracks) {
            try {
                const parsed = JSON.parse(savedTracks);
                for (const cat in parsed) {
                    if (playlistsData[cat]) {
                        playlistsData[cat] = parsed[cat];
                    }
                }
            } catch(e) {}
        }

        function refreshAllTracks() {
            let combined = [];
            for (const cat in playlistsData) {
                if (cat !== 'All Tracks') combined = combined.concat(playlistsData[cat]);
            }
            playlistsData['All Tracks'] = combined;
        }
        refreshAllTracks();

        /* ==========================================================
           অডিও প্লেয়ার ইঞ্জিন (HTML5 Native Streamer)
           ========================================================== */
        const audio = document.getElementById('native-audio');
        let currentPlaylistName = 'All Tracks';
        let tracks = playlistsData[currentPlaylistName];
        let currentTrackId = tracks.length > 0 ? tracks[0].id : null;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 'all';

        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = playPauseBtn.querySelector('i');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const repeatIcon = document.getElementById('repeat-icon');
        const artLoader = document.getElementById('art-loader');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressThumb = document.getElementById('progress-thumb');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');
        const trackTitleDisplay = document.getElementById('current-track-title');
        const trackArtistDisplay = document.getElementById('current-track-artist');
        const currentAlbumArt = document.getElementById('current-album-art');
        const volumeContainer = document.getElementById('volume-container');
        const volumeFill = document.getElementById('volume-fill');
        const volumeThumb = document.getElementById('volume-thumb');
        const muteIcon = document.getElementById('mute-icon');

        function formatTime(secs) {
            if (isNaN(secs) || secs < 0) return "00:00";
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function setPlayIcon(isPlay) {
            playIcon.className = isPlay ? 'fas fa-pause text-xl ml-0.5' : 'fas fa-play text-xl ml-0.5';
        }

        function updateProgressBar(percentage) {
            const clamped = Math.max(0, Math.min(100, percentage));
            progressFill.style.width = `${clamped}%`;
            progressThumb.style.left = `${clamped}%`;
        }

        function setVolume(val) {
            const clamped = Math.max(0, Math.min(1, val));
            audio.volume = clamped;
            audio.muted = clamped === 0;
            volumeFill.style.width = `${clamped * 100}%`;
            volumeThumb.style.left = `${clamped * 100}%`;
            muteIcon.className = clamped === 0 ? "fas fa-volume-mute text-gray-300 text-sm cursor-pointer" : "fas fa-volume-up text-gray-300 text-sm cursor-pointer";
        }

        window.playTrack = function(id) {
            let track = tracks.find(t => t.id === id);
            if (!track) {
                for (const cat in playlistsData) {
                    const found = playlistsData[cat].find(t => t.id === id);
                    if (found) { track = found; break; }
                }
            }
            if (!track) return;

            currentTrackId = track.id;
            updateProgressBar(0);
            currentTimeDisplay.textContent = "00:00";
            totalTimeDisplay.textContent = track.duration || "00:00";
            trackTitleDisplay.textContent = track.title;
            trackArtistDisplay.textContent = track.artist;
            if (track.image) currentAlbumArt.src = track.image;

            artLoader.classList.remove('hidden');

            let streamUrl = track.url;
            if (track.isYoutube) {
                streamUrl = `${BACKEND_URL}/stream?url=${encodeURIComponent(track.ytUrl)}`;
            }

            audio.src = streamUrl;
            audio.load();
            audio.play().then(() => {
                isPlaying = true;
                setPlayIcon(true);
                artLoader.classList.add('hidden');
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]";
                document.getElementById('status-text').textContent = "সার্ভার অনলাইন (Ad-Free Active)";
            }).catch(err => {
                artLoader.classList.add('hidden');
                console.warn("Playback error:", err);
            });

            updateActiveTrackUI();
            renderPlaylist();
        };

        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) {
                if (tracks.length > 0) playTrack(tracks[0].id);
                return;
            }
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                setPlayIcon(true);
            } else {
                audio.pause();
                isPlaying = false;
                setPlayIcon(false);
            }
            updateActiveTrackUI();
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration) && audio.duration > 0) {
                const pct = (audio.currentTime / audio.duration) * 100;
                updateProgressBar(pct);
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
                totalTimeDisplay.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', playNextTrack);

        function playNextTrack() {
            if (tracks.length === 0) return;
            if (repeatMode === 'one') {
                playTrack(currentTrackId);
                return;
            }
            if (isShuffle && tracks.length > 1) {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * tracks.length);
                } while (tracks[nextIdx].id === currentTrackId);
                playTrack(tracks[nextIdx].id);
                return;
            }
            const idx = tracks.findIndex(t => t.id === currentTrackId);
            if (idx !== -1 && idx < tracks.length - 1) {
                playTrack(tracks[idx + 1].id);
            } else if (repeatMode === 'all') {
                playTrack(tracks[0].id);
            } else {
                isPlaying = false;
                setPlayIcon(false);
            }
        }

        function playPrevTrack() {
            if (tracks.length === 0) return;
            const idx = tracks.findIndex(t => t.id === currentTrackId);
            if (idx > 0) {
                playTrack(tracks[idx - 1].id);
            } else {
                audio.currentTime = 0;
            }
        }

        nextBtn.addEventListener('click', playNextTrack);
        prevBtn.addEventListener('click', playPrevTrack);

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            if (!isNaN(audio.duration)) {
                audio.currentTime = pos * audio.duration;
            }
        });

        volumeContainer.addEventListener('click', (e) => {
            const rect = volumeContainer.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            setVolume(pos);
        });

        muteIcon.addEventListener('click', () => {
            setVolume(audio.volume > 0 ? 0 : 0.85);
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.className = isShuffle 
                ? "w-[36px] h-[36px] rounded-full text-[#ffb866] bg-white/10 transition-colors flex items-center justify-center" 
                : "w-[36px] h-[36px] rounded-full text-gray-400 hover:text-white transition-colors flex items-center justify-center";
        });

        repeatBtn.addEventListener('click', () => {
            if (repeatMode === 'all') {
                repeatMode = 'one';
                repeatBtn.innerHTML = '<i class="fas fa-repeat text-xs"></i><span class="text-[9px] font-bold absolute -top-1 -right-0.5 text-[#ffaa3c]">1</span>';
            } else if (repeatMode === 'one') {
                repeatMode = 'off';
                repeatBtn.className = "w-[36px] h-[36px] rounded-full text-gray-500 hover:text-white transition-colors flex items-center justify-center relative";
                repeatBtn.innerHTML = '<i class="fas fa-repeat text-xs"></i>';
            } else {
                repeatMode = 'all';
                repeatBtn.className = "w-[36px] h-[36px] rounded-full text-[#ffb866] hover:text-white transition-colors flex items-center justify-center relative";
                repeatBtn.innerHTML = '<i class="fas fa-repeat text-xs"></i>';
            }
        });

        function renderPlaylist() {
            const container = document.getElementById('playlist-items');
            if (!container) return;
            container.innerHTML = '';
            tracks = playlistsData[currentPlaylistName] || [];

            if (tracks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-gray-400 text-xs">
                        <i class="fas fa-music text-2xl mb-2 opacity-50 block"></i>
                        কোনো গান নেই। অ্যাডমিন আইকনে ক্লিক করে গান যুক্ত করুন।
                    </div>
                `;
            } else {
                tracks.forEach((track, index) => {
                    const num = index + 1;
                    const isActive = track.id === currentTrackId;
                    const item = document.createElement('div');
                    item.className = `playlist-item flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer mb-1 group ${isActive ? 'active' : ''}`;
                    item.onclick = () => playTrack(track.id);

                    item.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="text-xs text-gray-400 w-4 text-center font-medium shrink-0 index-container">${num}</span>
                            <span class="text-xs font-medium ${isActive ? 'text-[#ff9d33]' : 'text-white'} truncate max-w-[170px] title-container">${track.title}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[11px] text-gray-400 font-medium truncate max-w-[85px]">${track.artist}</span>
                            <i class="fas ${isActive && isPlaying ? 'fa-pause' : 'fa-play'} text-[9px] ${isActive ? 'text-[#ff9d33]' : 'text-gray-400 group-hover:text-white'}"></i>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById('playlist-main-title').textContent = `${currentPlaylistName.toUpperCase()} (${tracks.length})`;
            updateActiveTrackUI();
        }

        function updateActiveTrackUI() {
            document.querySelectorAll('.playlist-item').forEach((item, index) => {
                const track = tracks[index];
                if (!track) return;
                const isActive = track.id === currentTrackId;
                if (isActive) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        const categoryDrawer = document.getElementById('playlist-category-drawer');
        document.getElementById('open-category-drawer').addEventListener('click', () => categoryDrawer.classList.remove('-translate-x-full'));
        document.getElementById('close-category-drawer').addEventListener('click', () => categoryDrawer.classList.add('-translate-x-full'));

        window.selectCategory = function(cat) {
            currentPlaylistName = cat;
            tracks = playlistsData[cat] || playlistsData['All Tracks'];
            renderPlaylist();
            categoryDrawer.classList.add('-translate-x-full');
        };

        const toggleBtn = document.getElementById('toggle-playlist');
        const playlistItems = document.getElementById('playlist-items');
        const playlistIcon = document.getElementById('playlist-icon');
        const playlistToggleText = document.getElementById('playlist-toggle-text');
        const playlistContainer = document.getElementById('playlist-container');
        let isPlaylistVisible = true;

        toggleBtn.addEventListener('click', () => {
            isPlaylistVisible = !isPlaylistVisible;
            playlistItems.style.display = isPlaylistVisible ? 'block' : 'none';
            playlistIcon.classList.toggle('rotate-180', !isPlaylistVisible);
            playlistToggleText.textContent = isPlaylistVisible ? 'Hide List' : 'Show List';
            playlistContainer.style.height = isPlaylistVisible ? '60vh' : 'auto';
        });

        // পাসকোড ও অ্যাড মোডাল
        const CORRECT_PASSCODE = "47842828";
        const passcodeModal = document.getElementById('passcode-modal');
        const addModal = document.getElementById('add-modal');
        const inputPasscode = document.getElementById('input-passcode');
        const passcodeError = document.getElementById('passcode-error');

        document.getElementById('open-passcode-modal').addEventListener('click', () => {
            inputPasscode.value = '';
            passcodeError.classList.add('hidden');
            passcodeModal.classList.remove('hidden');
            setTimeout(() => inputPasscode.focus(), 50);
        });

        document.getElementById('close-passcode-modal').addEventListener('click', () => passcodeModal.classList.add('hidden'));
        document.getElementById('close-add-modal').addEventListener('click', () => addModal.classList.add('hidden'));

        document.getElementById('passcode-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputPasscode.value.trim() === CORRECT_PASSCODE) {
                passcodeModal.classList.add('hidden');
                addModal.classList.remove('hidden');
            } else {
                passcodeError.classList.remove('hidden');
                inputPasscode.value = '';
            }
        });

        // ট্যাব সুইচিং (Single Track vs Playlist)
        let isPlaylistMode = false;
        const tabSingle = document.getElementById('tab-single');
        const tabPlaylist = document.getElementById('tab-playlist');
        const urlLabel = document.getElementById('url-label');
        const inputSongUrl = document.getElementById('input-song-url');
        const urlHint = document.getElementById('url-hint');
        const btnSaveSong = document.getElementById('btn-save-song');

        tabSingle.addEventListener('click', () => {
            isPlaylistMode = false;
            tabSingle.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-[#FF8C00] text-white transition-all";
            tabPlaylist.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
            urlLabel.textContent = "YouTube বা MP3 লিংক";
            inputSongUrl.placeholder = "https://www.youtube.com/watch?v=...";
            urlHint.textContent = "একক গানের লিংক দিন";
            btnSaveSong.textContent = "বিজ্ঞাপন ছাড়া সেভ ও প্লে করুন";
        });

        tabPlaylist.addEventListener('click', () => {
            isPlaylistMode = true;
            tabPlaylist.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-[#FF8C00] text-white transition-all";
            tabSingle.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-all";
            urlLabel.textContent = "YouTube Playlist লিংক";
            inputSongUrl.placeholder = "https://www.youtube.com/playlist?list=...";
            urlHint.textContent = "প্লেলিস্টের সব গান স্বয়ংক্রিয়ভাবে তালিকায় যুক্ত হবে";
            btnSaveSong.textContent = "পুরো প্লেলিস্ট ফেচ করে যুক্ত করুন";
        });

        // গান বা প্লেলিস্ট যোগ করার ফর্ম সাবমিট
        const addSongForm = document.getElementById('add-song-form');
        const fetchLoader = document.getElementById('fetch-loader');
        const loaderMsg = document.getElementById('loader-msg');

        addSongForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const songUrl = inputSongUrl.value.trim();
            const category = document.getElementById('input-song-category').value;

            fetchLoader.classList.remove('hidden');
            btnSaveSong.disabled = true;

            if (!playlistsData[category]) playlistsData[category] = [];

            // মোড ১: পুরো প্লেলিস্ট যোগ করা
            if (isPlaylistMode) {
                loaderMsg.textContent = "প্লেলিস্ট থেকে সব গান লোড হচ্ছে... (কিছু সময় লাগতে পারে)";
                try {
                    const res = await fetch(`${BACKEND_URL}/playlist?url=${encodeURIComponent(songUrl)}`, { signal: AbortSignal.timeout(35000) });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.tracks && data.tracks.length > 0) {
                            playlistsData[category].push(...data.tracks);
                            refreshAllTracks();
                            localStorage.setItem('agomoni_user_tracks', JSON.stringify(playlistsData));
                            alert(`${data.tracks.length} টি গান সফলভাবে "${category}" ক্যাটাগরিতে যোগ হয়েছে!`);
                            selectCategory(category);
                            playTrack(data.tracks[0].id);
                        } else {
                            alert("প্লেলিস্টে কোনো গান পাওয়া যায়নি!");
                        }
                    } else {
                        alert("প্লেলিস্ট ফেচ করতে সমস্যা হয়েছে। প্লেলিস্টটি পাবলিক কিনা চেক করুন।");
                    }
                } catch (err) {
                    alert("সার্ভার রেসপন্স করছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।");
                }
            } 
            // মোড ২: একক গান যোগ করা
            else {
                loaderMsg.textContent = "গানের তথ্য আনা হচ্ছে...";
                const isYt = /(?:youtu\.be\/|youtube\.com)/.test(songUrl);
                let meta = {
                    title: "নতুন ট্র্যাক",
                    artist: "অজানা শিল্পী",
                    thumbnail: "https://placehold.co/150x150/3c1e0a/ffb450?text=Music"
                };

                if (isYt) {
                    try {
                        const res = await fetch(`${BACKEND_URL}/info?url=${encodeURIComponent(songUrl)}`, { signal: AbortSignal.timeout(15000) });
                        if (res.ok) {
                            const data = await res.json();
                            meta.title = data.title;
                            meta.artist = data.artist;
                            meta.thumbnail = data.thumbnail;
                        }
                    } catch(e) {}
                }

                const newTrack = {
                    id: 'track_' + Date.now(),
                    title: meta.title,
                    artist: meta.artist,
                    duration: "Stream",
                    isYoutube: isYt,
                    ytUrl: isYt ? songUrl : null,
                    url: !isYt ? songUrl : null,
                    image: meta.thumbnail
                };

                playlistsData[category].push(newTrack);
                refreshAllTracks();
                localStorage.setItem('agomoni_user_tracks', JSON.stringify(playlistsData));

                selectCategory(category);
                playTrack(newTrack.id);
            }

            fetchLoader.classList.add('hidden');
            btnSaveSong.disabled = false;
            addSongForm.reset();
            addModal.classList.add('hidden');
        });

        // ডিফল্ট ট্র্যাক লোড করা
        if (tracks.length > 0) {
            const first = tracks[0];
            trackTitleDisplay.textContent = first.title;
            trackArtistDisplay.textContent = first.artist;
            if (first.image) currentAlbumArt.src = first.image;
        }

        setVolume(1);
        renderPlaylist();
    </script>
</body>
</html>
